name: Capture Morningstar AUM

# WHY THIS EXISTS
# Morningstar's quote page carries the fund's EXACT Total Assets, but only for the CURRENT
# value — it keeps no history. A day missed is a day lost forever, which is exactly what
# happened to 2026-09-11 when the scraper existed but nothing ran it. So this has to be a
# scheduled job, not something that runs when a session happens to be open.
#
# It appends to situations/spacex_baron/data/morningstar_quote_raw.jsonl, keyed on the as-of
# trading day (resolved by matching the page's NAV against Yahoo's BPTIX close). Idempotent:
# re-running on the same as-of day is a no-op, so holidays and double-runs are harmless.
#
# Deliberately SEPARATE from rebuild-data.yml. build.py must stay network-free apart from the
# known Yahoo/EDGAR fetches; a third-party scrape inside the dashboard build would ship blank
# sections the day their markup changes. This job only writes the raw capture log.

on:
  schedule:
    # 12:10 UTC = 08:10 ET, Mon-Fri. Mutual-fund NAVs are struck after the prior close, so a
    # morning run reliably picks up the PREVIOUS trading day. Running in the morning rather
    # than the same evening avoids racing the NAV strike.
    - cron: "10 12 * * 1-5"
  workflow_dispatch: {}          # manual re-run, e.g. to backfill after an outage

permissions:
  contents: write

concurrency:
  group: morningstar-aum
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape and append
        id: scrape
        run: python -m situations.spacex_baron.ingest.morningstar_quote --append

      - name: Commit if changed
        run: |
          if git diff --quiet -- situations/spacex_baron/data/morningstar_quote_raw.jsonl; then
            echo "no new as-of day (already captured, or a market holiday) — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add situations/spacex_baron/data/morningstar_quote_raw.jsonl
          git commit -m "auto: capture Morningstar AUM [skip ci]"
          git push

      # A silent failure is the whole problem this job exists to fix, so make it loud.
      # The scrape step already exits non-zero on a markup change or an undatable page;
      # this turns that into a tracked issue rather than a red tick nobody looks at.
      - name: Open an issue if the capture failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Morningstar AUM capture failed (${new Date().toISOString().slice(0,10)})`,
              body: [
                "The scheduled Morningstar capture failed. **This day's exact AUM is unrecoverable**",
                "if it is not captured — the quote page keeps no history.",
                "",
                `Run: ${run}`,
                "",
                "Likely causes: their markup changed (the parser fails closed rather than guessing),",
                "the page NAV matched no recent BPTIX close, or the request was blocked.",
                "",
                "Fix and re-run via `workflow_dispatch` the SAME DAY if possible.",
              ].join("\n"),
            });
