name: Rebuild dashboard JSON

# Triggered when the Morningstar AUM log (or any spacex_baron input) changes —
# regenerates dashboard/data/spacex_baron.json and commits if it differs. The
# Vercel deploy then picks up the fresh JSON automatically.
# `[skip ci]` in the commit message + GITHUB_TOKEN pushes not retriggering
# workflows together prevent any loop.

on:
  push:
    branches: [main]
    paths:
      - "situations/**"
      - "config.py"
      - "build.py"
      - "!situations/**/data/raw/**"
  workflow_dispatch:

concurrency:
  group: rebuild-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild dashboard JSON (fetch fresh prices so series auto-extend)
        run: python build.py
      - name: Commit refreshed JSON + price/NAV if changed
        run: |
          git add dashboard/data/*.json situations/spacex_baron/data/processed/nav_daily.csv situations/vcx_fundrise/data/processed/price_daily.csv
          if [ -n "$(git status --porcelain dashboard/data/ situations/spacex_baron/data/processed/nav_daily.csv situations/vcx_fundrise/data/processed/price_daily.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "auto: rebuild dashboard JSON + NAV [skip ci]"
            git push
          else
            echo "no change — skipping commit"
          fi
